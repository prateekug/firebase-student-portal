<!DOCTYPE html>
<html lang="en">
<head>
    <title>Teacher Signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="faculty-page">

<div class="login-card">

    <h1>Teacher Signup</h1>

    <form id="teacherSignupForm">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Official Email" required>
        <input type="text" id="department" placeholder="Department (e.g., CSE)" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="login-btn">Create Account</button>
    </form>

    <p id="signupMessage" style="margin-top: 10px;"></p>

    <p class="approval-text">
        *Your account will be approved by admin
    </p>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyANHKn4he1oT1cqWriKYR4OBz5JAv6iIZk",
  authDomain: "virtual-ai-lab-e2a95.firebaseapp.com",
  projectId: "virtual-ai-lab-e2a95",
  storageBucket: "virtual-ai-lab-e2a95.firebasestorage.app",
  messagingSenderId: "216930653843",
  appId: "1:216930653843:web:c5814218b8ba957f349f66",
  measurementId: "G-XTD7Y22TYC"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("teacherSignupForm");

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const department = document.getElementById("department").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("signupMessage");

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const uid = userCredential.user.uid;

    await setDoc(doc(db, "faculty", uid), {
      name: name,
      email: email,
      department: department,
      role: "faculty",
      approved: false
    });

    message.style.color = "green";
    message.innerText = "Account Created! Waiting for admin approval...";

    setTimeout(() => {
      window.location.href = "teacher_loginpage.html";
    }, 2000);

  } catch (error) {
    message.style.color = "red";
    message.innerText = error.message;
  }
});
</script>

</body>
</html>
